[package]
name = "platform-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ports et adapters OS pour Runa (clipboard, focus, injection, trigger)"

[dependencies]
shared-types = { workspace = true }
shared-utils = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xfixes", "xtest"] }
evdev = "0.12"
ashpd = { version = "0.11", features = ["tokio"] }
futures-util = "0.3"
nix = { version = "0.29", default-features = false, features = ["poll", "fs"] }
libc = "0.2"

[lints]
workspace = true
