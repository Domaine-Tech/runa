[package]
name = "runa-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shell Tauri v2 — composition root Runa"
default-run = "runa-desktop"

[lib]
name = "runa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
llama = ["ai-engine/llama"]
llama-vulkan = ["llama", "ai-engine/llama-vulkan"]

[dependencies]
shared-types = { workspace = true }
shared-utils = { workspace = true }
platform-engine = { workspace = true }
ai-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
specta = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
blake3 = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "0.0.9"

[lints]
workspace = true
